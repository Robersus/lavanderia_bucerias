<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lavandería | Demo</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-dark: #15803d;
      --whatsapp: #25d366;
      --danger: #dc2626;
      --text: #172033;
      --muted: #64748b;
      --background: #f1f5f9;
      --card: #ffffff;
      --input: #f8fafc;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-icon {
      font-size: 44px;
      margin-bottom: 5px;
    }

    .header h1 {
      margin: 0 0 7px;
      font-size: 29px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .demo-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      min-height: 55px;
      padding: 13px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--input);
      color: var(--text);
      font-size: 18px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    select {
      cursor: pointer;
    }

    .help {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .price-wrapper {
      position: relative;
    }

    .currency {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: bold;
      font-size: 18px;
    }

    .price-wrapper input {
      padding-left: 50px;
    }

    .submit-button {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:active {
      transform: scale(.98);
    }

    .message {
      display: none;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      font-weight: bold;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .records-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .records-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .counter {
      padding: 6px 11px;
      border-radius: 20px;
      background: #e2e8f0;
      color: #334155;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      padding: 25px 10px;
      text-align: center;
      color: var(--muted);
    }

    .record {
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .record:last-child {
      margin-bottom: 0;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .record-name {
      font-size: 18px;
      font-weight: bold;
    }

    .record-folio {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .record-price {
      font-size: 19px;
      font-weight: bold;
      white-space: nowrap;
    }

    .details {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .detail {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .detail-label {
      color: var(--muted);
      min-width: 75px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: bold;
      font-size: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .message-button {
      min-height: 50px;
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .message-one {
      background: var(--primary);
    }

    .message-two {
      background: var(--success);
    }

    /* MODAL */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15,23,42,.68);
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    .modal-subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .preview {
      white-space: pre-wrap;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 18px;
      font-size: 15px;
      line-height: 1.55;
    }

    .modal-buttons {
      display: grid;
      gap: 10px;
    }

    .send-whatsapp {
      min-height: 57px;
      border: none;
      border-radius: 13px;
      background: var(--whatsapp);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal {
      min-height: 50px;
      border: 2px solid var(--border);
      border-radius: 13px;
      background: white;
      color: var(--text);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      .card {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         CAPTURA DE PEDIDO
         ========================= -->

    <section class="card">

      <header class="header">

        <div class="header-icon">🧺</div>

        <h1>Nuevo Pedido</h1>

        <p>Captura los datos del cliente</p>

        <span class="demo-badge">
          DEMO · MODO PRESENTACIÓN
        </span>

      </header>

      <div
        id="statusMessage"
        class="message">
      </div>

      <form id="pedidoForm">

        <!-- FOLIO -->
        <div class="form-group">

          <label for="folio">
            Folio del ticket
          </label>

          <input
            id="folio"
            type="text"
            placeholder="Ej. 1258"
            autocomplete="off"
            required>

        </div>


        <!-- NOMBRE -->
        <div class="form-group">

          <label for="nombre">
            Nombre del cliente
          </label>

          <input
            id="nombre"
            type="text"
            placeholder="Nombre completo"
            autocomplete="name"
            required>

        </div>


        <!-- TELÉFONO -->
        <div class="form-group">

          <label for="telefono">
            Teléfono
          </label>

          <input
            id="telefono"
            type="tel"
            placeholder="10 dígitos"
            inputmode="numeric"
            maxlength="10"
            required>

          <span class="help">
            Ejemplo: 5512345678
          </span>

        </div>


        <!-- SERVICIO -->
        <div class="form-group">

          <label for="servicio">
            Tipo de servicio
          </label>

          <select
            id="servicio"
            required>

            <option value="">
              Selecciona una opción
            </option>

            <option value="Ropa">
              👕 Ropa
            </option>

            <option value="Toallas">
              🛁 Toallas
            </option>

            <option value="Colchas">
              🛏️ Colchas
            </option>

            <option value="Edredones">
              🛌 Edredones
            </option>

            <option value="Blancos">
              🏠 Blancos
            </option>

            <option value="Uniformes">
              👔 Uniformes
            </option>

            <option value="Cortinas">
              🪟 Cortinas
            </option>

            <option value="Otro">
              📦 Otro
            </option>

          </select>

        </div>


        <!-- PRECIO -->
        <div class="form-group">

          <label for="precio">
            Precio
          </label>

          <div class="price-wrapper">

            <span class="currency">$</span>

            <input
              id="precio"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="0.00"
              inputmode="decimal"
              required>

          </div>

          <span class="help">
            Precio en pesos mexicanos
          </span>

        </div>


        <!-- FECHA -->
        <div class="form-group">

          <label for="entrega">
            Fecha y hora de entrega
          </label>

          <input
            id="entrega"
            type="datetime-local"
            required>

        </div>


        <button
          class="submit-button"
          type="submit">

          Registrar pedido

        </button>

      </form>

    </section>


    <!-- =========================
         REGISTROS
         ========================= -->

    <section class="card">

      <div class="records-header">

        <h2>📋 Pedidos registrados</h2>

        <span
          id="counter"
          class="counter">
          0 pedidos
        </span>

      </div>


      <div id="records">

        <div class="empty">
          Todavía no hay pedidos registrados.
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       MODAL DE VISTA PREVIA
       ========================= -->

  <div
    id="modalOverlay"
    class="modal-overlay">

    <div class="modal">

      <h2 id="modalTitle">
        💬 Vista previa
      </h2>

      <p class="modal-subtitle">
        Revisa el mensaje antes de enviarlo.
      </p>

      <div
        id="preview"
        class="preview">
      </div>

      <div class="modal-buttons">

        <button
          id="sendWhatsapp"
          class="send-whatsapp"
          type="button">

          💬 Enviar por WhatsApp

        </button>

        <button
          id="closeModal"
          class="close-modal"
          type="button">

          Cancelar

        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       DEMO 100% FRONTEND
       =====================================================

       No existe backend.
       No existe fetch.
       No existe n8n.
       No existe Supabase.

       Los pedidos solamente existen en memoria.

       La única conexión externa ocurre cuando el usuario
       decide enviar un mensaje mediante WhatsApp.
       ===================================================== */


    /* =========================
       REFERENCIAS
       ========================= */

    const form =
      document.getElementById("pedidoForm");

    const folio =
      document.getElementById("folio");

    const nombre =
      document.getElementById("nombre");

    const telefono =
      document.getElementById("telefono");

    const servicio =
      document.getElementById("servicio");

    const precio =
      document.getElementById("precio");

    const entrega =
      document.getElementById("entrega");

    const statusMessage =
      document.getElementById("statusMessage");

    const records =
      document.getElementById("records");

    const counter =
      document.getElementById("counter");

    const modalOverlay =
      document.getElementById("modalOverlay");

    const modalTitle =
      document.getElementById("modalTitle");

    const preview =
      document.getElementById("preview");

    const sendWhatsapp =
      document.getElementById("sendWhatsapp");

    const closeModal =
      document.getElementById("closeModal");


    /* =========================
       MEMORIA DE LA DEMO
       ========================= */

    let pedidos = [];

    let pedidoSeleccionado = null;

    let mensajeActual = "";


    /* =========================
       FECHA ACTUAL
       ========================= */

    function establecerFechaActual() {

      const ahora = new Date();

      ahora.setMinutes(
        ahora.getMinutes() -
        ahora.getTimezoneOffset()
      );

      entrega.value =
        ahora.toISOString().slice(0,16);
    }

    establecerFechaActual();


    /* =========================
       MENSAJES DE ESTADO
       ========================= */

    function mostrarEstado(tipo, texto) {

      statusMessage.className =
        `message ${tipo}`;

      statusMessage.textContent =
        texto;
    }


    function ocultarEstado() {

      statusMessage.className =
        "message";

      statusMessage.textContent =
        "";
    }


    /* =========================
       FORMATO DE PRECIO
       ========================= */

    function dinero(valor) {

      return Number(valor).toLocaleString(
        "es-MX",
        {
          style: "currency",
          currency: "MXN"
        }
      );
    }


    /* =========================
       FORMATO DE FECHA
       ========================= */

    function fechaBonita(valor) {

      const fecha =
        new Date(valor);

      return fecha.toLocaleString(
        "es-MX",
        {
          dateStyle: "long",
          timeStyle: "short"
        }
      );
    }


    /* =========================
       ESCAPAR HTML
       ========================= */

    function escapeHTML(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       RENDERIZAR REGISTROS
       ========================= */

    function renderizarPedidos() {

      if (pedidos.length === 0) {

        records.innerHTML = `
          <div class="empty">
            Todavía no hay pedidos registrados.
          </div>
        `;

        counter.textContent =
          "0 pedidos";

        return;
      }


      counter.textContent =
        pedidos.length === 1
          ? "1 pedido"
          : `${pedidos.length} pedidos`;


      records.innerHTML =
        pedidos
          .slice()
          .reverse()
          .map(pedido => `

            <article class="record">

              <div class="record-top">

                <div>

                  <div class="record-name">
                    ${escapeHTML(
                      pedido.nombre
                    )}
                  </div>

                  <span class="record-folio">
                    Folio:
                    ${escapeHTML(
                      pedido.folio
                    )}
                  </span>

                </div>


                <div class="record-price">

                  ${dinero(
                    pedido.precio
                  )}

                </div>

              </div>


              <div class="details">

                <div class="detail">

                  <span class="detail-label">
                    Servicio:
                  </span>

                  <span class="badge">

                    ${escapeHTML(
                      pedido.servicio
                    )}

                  </span>

                </div>


                <div class="detail">

                  <span class="detail-label">
                    Teléfono:
                  </span>

                  <strong>
                    ${escapeHTML(
                      pedido.telefono
                    )}
                  </strong>

                </div>


                <div class="detail">

                  <span class="detail-label">
                    Entrega:
                  </span>

                  <strong>
                    ${fechaBonita(
                      pedido.entrega
                    )}
                  </strong>

                </div>

              </div>


              <div class="actions">

                <button
                  type="button"
                  class="message-button message-one"
                  onclick="abrirMensaje(
                    '${pedido.id}',
                    1
                  )">

                  💬 Mensaje 1

                </button>


                <button
                  type="button"
                  class="message-button message-two"
                  onclick="abrirMensaje(
                    '${pedido.id}',
                    2
                  )">

                  💬 Mensaje 2

                </button>

              </div>

            </article>

          `)
          .join("");
    }


    /* =========================
       MENSAJE 1
       ========================= */

    function crearMensaje1(pedido) {

      return `¡Hola, ${pedido.nombre}! 👋

Muchas gracias por elegirnos para cuidar tu ${pedido.servicio}. 🧺✨

Tu servicio estará listo el:

📅 ${fechaBonita(pedido.entrega)}

💰 Total: ${dinero(pedido.precio)}

📋 Folio: ${pedido.folio}

Agradecemos mucho tu preferencia.
¡Será un placer atenderte! 😊`;
    }


    /* =========================
       MENSAJE 2
       ========================= */

    function crearMensaje2(pedido) {

      return `¡Hola, ${pedido.nombre}! 👋

Te informamos que tu ${pedido.servicio} ya está lista. 🧺✨

📋 Folio: ${pedido.folio}

💰 Total: ${dinero(pedido.precio)}

Tu servicio ya se encuentra disponible para recoger.

¡Muchas gracias por elegirnos! 😊`;
    }


    /* =========================
       ABRIR VISTA PREVIA
       ========================= */

    function abrirMensaje(id, numero) {

      const pedido =
        pedidos.find(
          p => p.id === id
        );


      if (!pedido) {
        return;
      }


      pedidoSeleccionado =
        pedido;


      if (numero === 1) {

        mensajeActual =
          crearMensaje1(pedido);

        modalTitle.textContent =
          "💬 Vista previa — Mensaje 1";

      } else {

        mensajeActual =
          crearMensaje2(pedido);

        modalTitle.textContent =
          "💬 Vista previa — Mensaje 2";
      }


      preview.textContent =
        mensajeActual;


      modalOverlay.classList.add(
        "active"
      );
    }


    /* =========================
       CERRAR MODAL
       ========================= */

    function cerrarModal() {

      modalOverlay.classList.remove(
        "active"
      );

      pedidoSeleccionado =
        null;

      mensajeActual =
        "";
    }


    closeModal.addEventListener(
      "click",
      cerrarModal
    );


    /* =========================
       ENVIAR WHATSAPP REAL
       ========================= */

    sendWhatsapp.addEventListener(
      "click",
      function() {

        if (
          !pedidoSeleccionado ||
          !mensajeActual
        ) {
          return;
        }


        /*
         * México utiliza el prefijo +52.
         *
         * El número se convierte:
         *
         * 5512345678
         *
         * en:
         *
         * 525512345678
         */

        const numero =
          "52" +
          pedidoSeleccionado.telefono;


        const texto =
          encodeURIComponent(
            mensajeActual
          );


        /*
         * ESTA ES LA ÚNICA PARTE QUE SALE
         * DE LA DEMO.
         *
         * Abre WhatsApp real con el mensaje
         * preparado.
         */

        const whatsappURL =
          `https://wa.me/${numero}?text=${texto}`;


        window.open(
          whatsappURL,
          "_blank"
        );


        cerrarModal();

      }
    );


    /* =========================
       SUBMIT DEL FORMULARIO
       ========================= */

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        ocultarEstado();


        /* VALIDACIONES */

        if (!folio.value.trim()) {

          mostrarEstado(
            "error",
            "Captura el folio del ticket."
          );

          folio.focus();

          return;
        }


        if (!nombre.value.trim()) {

          mostrarEstado(
            "error",
            "Captura el nombre del cliente."
          );

          nombre.focus();

          return;
        }


        if (
          !/^\d{10}$/.test(
            telefono.value.trim()
          )
        ) {

          mostrarEstado(
            "error",
            "El teléfono debe tener exactamente 10 dígitos."
          );

          telefono.focus();

          return;
        }


        if (!servicio.value) {

          mostrarEstado(
            "error",
            "Selecciona el tipo de servicio."
          );

          servicio.focus();

          return;
        }


        const precioNumero =
          parseFloat(
            precio.value
          );


        if (
          isNaN(precioNumero) ||
          precioNumero <= 0
        ) {

          mostrarEstado(
            "error",
            "El precio debe ser mayor a $0.00 MXN."
          );

          precio.focus();

          return;
        }


        if (!entrega.value) {

          mostrarEstado(
            "error",
            "Selecciona la fecha y hora de entrega."
          );

          entrega.focus();

          return;
        }


        /* CREAR PEDIDO */

        const nuevoPedido = {

          id:
            Date.now().toString() +
            Math.random()
              .toString(36)
              .substring(2),

          folio:
            folio.value.trim(),

          nombre:
            nombre.value.trim(),

          telefono:
            telefono.value.trim(),

          servicio:
            servicio.value,

          precio:
            precioNumero,

          entrega:
            new Date(
              entrega.value
            ).toISOString()

        };


        /* GUARDAR EN MEMORIA */

        pedidos.push(
          nuevoPedido
        );


        /* ACTUALIZAR PANTALLA */

        renderizarPedidos();


        /* MENSAJE DE ÉXITO */

        mostrarEstado(
          "success",
          `✓ Pedido registrado correctamente. Folio: ${nuevoPedido.folio}`
        );


        /* LIMPIAR */

        form.reset();

        establecerFechaActual();

        folio.focus();

      }
    );


    /* =========================
       TELÉFONO: SOLO NÚMEROS
       ========================= */

    telefono.addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 10);

      }
    );


    /* =========================
       CERRAR MODAL AL TOCAR FUERA
       ========================= */

    modalOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modalOverlay
        ) {

          cerrarModal();

        }

      }
    );


    /* =========================
       INICIO
       ========================= */

    renderizarPedidos();

  </script>

</body>
</html>
