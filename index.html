<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Lavandería | Recepción de pedidos</title>

  <style>
    /* =====================================================
       VARIABLES
       ===================================================== */

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --success: #16a34a;
      --success-dark: #15803d;

      --whatsapp: #25d366;
      --whatsapp-dark: #1ebe5d;

      --error: #dc2626;

      --text: #172033;
      --muted: #64748b;

      --background: #f1f5f9;
      --card: #ffffff;
      --input-bg: #f8fafc;
      --border: #cbd5e1;

      --shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--background);
      color: var(--text);
    }


    /* =====================================================
       CONTENEDOR
       ===================================================== */

    .container {
      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      padding: 16px;
    }


    .card {
      background: var(--card);

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow: var(--shadow);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      text-align: center;

      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 42px;

      margin-bottom: 6px;
    }

    .header h1 {
      margin: 0 0 8px;

      font-size: 28px;
    }

    .header p {
      margin: 0;

      color: var(--muted);

      font-size: 15px;
    }


    /* =====================================================
       FORMULARIO
       ===================================================== */

    .form-group {
      margin-bottom: 18px;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 16px;

      font-weight: 700;
    }


    input,
    select {
      width: 100%;

      min-height: 54px;

      padding: 13px 14px;

      border: 2px solid var(--border);

      border-radius: 12px;

      background: var(--input-bg);

      color: var(--text);

      font-size: 18px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    select {
      appearance: auto;

      cursor: pointer;
    }


    input:focus,
    select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }


    .help-text {
      display: block;

      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;
    }


    /* =====================================================
       PRECIO
       ===================================================== */

    .price-wrapper {
      position: relative;
    }


    .currency {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 18px;

      font-weight: 700;

      color: var(--muted);

      pointer-events: none;
    }


    .price-wrapper input {
      padding-left: 52px;
    }


    /* =====================================================
       BOTÓN PRINCIPAL
       ===================================================== */

    .submit-button {
      width: 100%;

      min-height: 60px;

      margin-top: 8px;

      border: none;

      border-radius: 14px;

      background: var(--primary);

      color: white;

      font-size: 19px;

      font-weight: 700;

      cursor: pointer;

      touch-action: manipulation;
    }


    .submit-button:active {
      transform: scale(0.98);
    }


    .submit-button:hover {
      background: var(--primary-dark);
    }


    .submit-button:disabled {
      background: #94a3b8;

      cursor: not-allowed;
    }


    /* =====================================================
       MENSAJES DE ESTADO
       ===================================================== */

    .message {
      display: none;

      margin-bottom: 20px;

      padding: 14px;

      border-radius: 12px;

      font-size: 15px;

      line-height: 1.4;

      font-weight: 600;
    }


    .message.success {
      display: block;

      background: #dcfce7;

      color: #166534;

      border: 1px solid #86efac;
    }


    .message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;

      border: 1px solid #fca5a5;
    }


    /* =====================================================
       REGISTROS
       ===================================================== */

    .records-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 16px;
    }


    .records-header h2 {
      margin: 0;

      font-size: 22px;
    }


    .record-count {
      background: #e2e8f0;

      color: #334155;

      padding: 6px 10px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: 700;
    }


    .empty-records {
      text-align: center;

      color: var(--muted);

      padding: 25px 10px;

      font-size: 15px;
    }


    /* =====================================================
       TARJETA DE REGISTRO
       ===================================================== */

    .record {
      border: 1px solid var(--border);

      border-radius: 15px;

      padding: 16px;

      margin-bottom: 12px;

      background: #fff;
    }


    .record:last-child {
      margin-bottom: 0;
    }


    .record-top {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 10px;

      margin-bottom: 12px;
    }


    .record-name {
      font-size: 18px;

      font-weight: 700;
    }


    .record-folio {
      display: inline-block;

      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
    }


    .record-price {
      font-size: 19px;

      font-weight: 800;

      white-space: nowrap;
    }


    .record-details {
      display: grid;

      gap: 7px;

      margin-bottom: 14px;

      font-size: 14px;
    }


    .detail {
      display: flex;

      gap: 7px;

      align-items: center;
    }


    .detail-label {
      color: var(--muted);

      min-width: 85px;
    }


    .service-badge {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 8px;

      background: #eff6ff;

      color: #1d4ed8;

      font-size: 13px;

      font-weight: 700;
    }


    /* =====================================================
       BOTONES DE WHATSAPP
       ===================================================== */

    .record-actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }


    .message-button {
      min-height: 50px;

      border: none;

      border-radius: 11px;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      touch-action: manipulation;
    }


    .message-button:active {
      transform: scale(0.97);
    }


    .message-one {
      background: var(--primary);
    }


    .message-one:hover {
      background: var(--primary-dark);
    }


    .message-two {
      background: var(--success);
    }


    .message-two:hover {
      background: var(--success-dark);
    }


    /* =====================================================
       MODAL DE VISTA PREVIA
       ===================================================== */

    .modal-overlay {
      display: none;

      position: fixed;

      z-index: 1000;

      inset: 0;

      background: rgba(15, 23, 42, 0.65);

      padding: 16px;

      align-items: center;

      justify-content: center;
    }


    .modal-overlay.active {
      display: flex;
    }


    .modal {
      width: 100%;

      max-width: 500px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);
    }


    .modal h2 {
      margin: 0 0 5px;

      font-size: 23px;
    }


    .modal-subtitle {
      margin: 0 0 16px;

      color: var(--muted);

      font-size: 14px;
    }


    .preview-box {
      background: #f8fafc;

      border: 1px solid var(--border);

      border-radius: 13px;

      padding: 16px;

      margin-bottom: 18px;

      white-space: pre-wrap;

      font-size: 15px;

      line-height: 1.55;
    }


    .modal-actions {
      display: grid;

      gap: 10px;
    }


    .send-whatsapp {
      min-height: 56px;

      border: none;

      border-radius: 13px;

      background: var(--whatsapp);

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }


    .send-whatsapp:hover {
      background: var(--whatsapp-dark);
    }


    .close-modal {
      min-height: 50px;

      border: 2px solid var(--border);

      border-radius: 13px;

      background: white;

      color: var(--text);

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }


    /* =====================================================
       TABLET / DESKTOP
       ===================================================== */

    @media (min-width: 600px) {

      .container {
        padding: 30px 20px;
      }

      .card {
        padding: 30px;
      }

      .header h1 {
        font-size: 32px;
      }
    }

  </style>
</head>


<body>

  <main class="container">

    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <section class="card">

      <header class="header">

        <div class="header-icon">
          🧺
        </div>

        <h1>
          Nuevo Pedido
        </h1>

        <p>
          Captura los datos de la ropa del cliente
        </p>

      </header>


      <!-- Mensaje de éxito/error -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite">
      </div>


      <form
        id="pedidoForm"
        novalidate>


        <!-- FOLIO -->

        <div class="form-group">

          <label for="folio">
            Folio del ticket
          </label>

          <input
            type="text"
            id="folio"
            name="folio"
            placeholder="Ej. 1258"
            autocomplete="off"
            required>

        </div>


        <!-- NOMBRE -->

        <div class="form-group">

          <label for="nombre_cliente">
            Nombre del cliente
          </label>

          <input
            type="text"
            id="nombre_cliente"
            name="nombre_cliente"
            placeholder="Nombre completo"
            autocomplete="name"
            required>

        </div>


        <!-- TELÉFONO -->

        <div class="form-group">

          <label for="telefono">
            Teléfono
          </label>

          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="10 dígitos"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
            required>

          <span class="help-text">
            Ejemplo: 5512345678
          </span>

        </div>


        <!-- TIPO DE SERVICIO -->

        <div class="form-group">

          <label for="tipo_servicio">
            ¿Qué tipo de servicio es?
          </label>

          <select
            id="tipo_servicio"
            name="tipo_servicio"
            required>

            <option value="">
              Selecciona una opción
            </option>

            <option value="Ropa">
              👕 Ropa
            </option>

            <option value="Toallas">
              🛁 Toallas
            </option>

            <option value="Colchas">
              🛏️ Colchas
            </option>

            <option value="Edredones">
              🛌 Edredones
            </option>

            <option value="Blancos">
              🏠 Blancos
            </option>

            <option value="Uniformes">
              👔 Uniformes
            </option>

            <option value="Cortinas">
              🪟 Cortinas
            </option>

            <option value="Otro">
              📦 Otro
            </option>

          </select>

        </div>


        <!-- PRECIO -->

        <div class="form-group">

          <label for="precio">
            Precio
          </label>

          <div class="price-wrapper">

            <span class="currency">
              $
            </span>

            <input
              type="number"
              id="precio"
              name="precio"
              placeholder="0.00"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              required>

          </div>

          <span class="help-text">
            Precio en pesos mexicanos (MXN)
          </span>

        </div>


        <!-- FECHA -->

        <div class="form-group">

          <label for="fecha_hora_entrega">
            Fecha y hora de entrega
          </label>

          <input
            type="datetime-local"
            id="fecha_hora_entrega"
            name="fecha_hora_entrega"
            required>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="submit-button"
          id="submitButton">

          Registrar pedido

        </button>

      </form>

    </section>


    <!-- =================================================
         REGISTROS
         ================================================= -->

    <section class="card">

      <div class="records-header">

        <h2>
          📋 Pedidos registrados
        </h2>

        <span
          id="recordCount"
          class="record-count">

          0 pedidos

        </span>

      </div>


      <div id="recordsContainer">

        <div class="empty-records">
          Todavía no hay pedidos registrados.
        </div>

      </div>

    </section>

  </main>


  <!-- ===================================================
       MODAL DE MENSAJE
       =================================================== -->

  <div
    id="modalOverlay"
    class="modal-overlay">

    <div class="modal">

      <h2 id="modalTitle">
        Vista previa
      </h2>

      <p class="modal-subtitle">
        Revisa el mensaje antes de enviarlo por WhatsApp.
      </p>


      <div
        id="previewBox"
        class="preview-box">
      </div>


      <div class="modal-actions">

        <button
          type="button"
          id="sendWhatsappButton"
          class="send-whatsapp">

          💬 Enviar por WhatsApp

        </button>


        <button
          type="button"
          id="closeModalButton"
          class="close-modal">

          Cancelar

        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const WEBHOOK_URL =
      "PEGAR_AQUI_LA_URL_DEL_WEBHOOK";


    /* =====================================================
       REFERENCIAS
       ===================================================== */

    const form =
      document.getElementById("pedidoForm");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");

    const folioInput =
      document.getElementById("folio");

    const nombreInput =
      document.getElementById("nombre_cliente");

    const telefonoInput =
      document.getElementById("telefono");

    const servicioInput =
      document.getElementById("tipo_servicio");

    const precioInput =
      document.getElementById("precio");

    const fechaInput =
      document.getElementById("fecha_hora_entrega");

    const recordsContainer =
      document.getElementById("recordsContainer");

    const recordCount =
      document.getElementById("recordCount");

    const modalOverlay =
      document.getElementById("modalOverlay");

    const modalTitle =
      document.getElementById("modalTitle");

    const previewBox =
      document.getElementById("previewBox");

    const sendWhatsappButton =
      document.getElementById("sendWhatsappButton");

    const closeModalButton =
      document.getElementById("closeModalButton");


    /* =====================================================
       ARRAY DE REGISTROS
       ===================================================== */

    // Los registros viven en memoria mientras la página
    // permanezca abierta.

    let registros = [];


    // Registro actualmente seleccionado para enviar mensaje.

    let registroSeleccionado = null;

    let mensajeSeleccionado = "";


    /* =====================================================
       FECHA ACTUAL
       ===================================================== */

    function establecerFechaActual() {

      const ahora = new Date();

      ahora.setMinutes(
        ahora.getMinutes() -
        ahora.getTimezoneOffset()
      );

      fechaInput.value =
        ahora.toISOString().slice(0, 16);
    }


    establecerFechaActual();


    /* =====================================================
       MENSAJES DE ESTADO
       ===================================================== */

    function ocultarMensaje() {

      message.className =
        "message";

      message.textContent =
        "";
    }


    function mostrarMensaje(tipo, texto) {

      message.className =
        `message ${tipo}`;

      message.textContent =
        texto;

      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }


    /* =====================================================
       FORMATEAR FECHA
       ===================================================== */

    function formatearFecha(fechaISO) {

      const fecha =
        new Date(fechaISO);

      return fecha.toLocaleString(
        "es-MX",
        {
          dateStyle: "long",
          timeStyle: "short"
        }
      );
    }


    /* =====================================================
       CONVERTIR FECHA LOCAL A ISO
       ===================================================== */

    function convertirAISO(fechaLocal) {

      const fecha =
        new Date(fechaLocal);

      return fecha.toISOString();
    }


    /* =====================================================
       VALIDACIÓN
       ===================================================== */

    function validarFormulario() {

      const folio =
        folioInput.value.trim();

      const nombre =
        nombreInput.value.trim();

      const telefono =
        telefonoInput.value.trim();

      const servicio =
        servicioInput.value;

      const precio =
        parseFloat(precioInput.value);

      const fecha =
        fechaInput.value;


      if (!folio) {

        mostrarMensaje(
          "error",
          "Por favor captura el folio."
        );

        folioInput.focus();

        return false;
      }


      if (!nombre) {

        mostrarMensaje(
          "error",
          "Por favor captura el nombre del cliente."
        );

        nombreInput.focus();

        return false;
      }


      if (!/^\d{10}$/.test(telefono)) {

        mostrarMensaje(
          "error",
          "El teléfono debe contener exactamente 10 dígitos."
        );

        telefonoInput.focus();

        return false;
      }


      if (!servicio) {

        mostrarMensaje(
          "error",
          "Selecciona el tipo de servicio."
        );

        servicioInput.focus();

        return false;
      }


      if (isNaN(precio) || precio <= 0) {

        mostrarMensaje(
          "error",
          "El precio debe ser mayor a $0.00 MXN."
        );

        precioInput.focus();

        return false;
      }


      if (!fecha) {

        mostrarMensaje(
          "error",
          "Selecciona la fecha y hora de entrega."
        );

        fechaInput.focus();

        return false;
      }


      return true;
    }


    /* =====================================================
       CREAR REGISTRO VISUAL
       ===================================================== */

    function renderizarRegistros() {

      if (registros.length === 0) {

        recordsContainer.innerHTML = `
          <div class="empty-records">
            Todavía no hay pedidos registrados.
          </div>
        `;

        recordCount.textContent =
          "0 pedidos";

        return;
      }


      recordCount.textContent =
        registros.length === 1
          ? "1 pedido"
          : `${registros.length} pedidos`;


      recordsContainer.innerHTML =
        registros
          .slice()
          .reverse()
          .map((registro, index) => {

            return `
              <article class="record">

                <div class="record-top">

                  <div>

                    <div class="record-name">
                      ${escaparHTML(registro.nombre_cliente)}
                    </div>

                    <span class="record-folio">
                      Folio: ${escaparHTML(registro.folio)}
                    </span>

                  </div>


                  <div class="record-price">
                    ${formatearPrecio(registro.precio)}
                  </div>

                </div>


                <div class="record-details">

                  <div class="detail">

                    <span class="detail-label">
                      Servicio:
                    </span>

                    <span class="service-badge">
                      ${escaparHTML(registro.tipo_servicio)}
                    </span>

                  </div>


                  <div class="detail">

                    <span class="detail-label">
                      Teléfono:
                    </span>

                    <strong>
                      ${escaparHTML(registro.telefono)}
                    </strong>

                  </div>


                  <div class="detail">

                    <span class="detail-label">
                      Entrega:
                    </span>

                    <strong>
                      ${formatearFecha(registro.fecha_hora_entrega)}
                    </strong>

                  </div>

                </div>


                <div class="record-actions">

                  <button
                    type="button"
                    class="message-button message-one"
                    onclick="abrirMensaje(${registro.id}, 1)">

                    💬 Mensaje 1

                  </button>


                  <button
                    type="button"
                    class="message-button message-two"
                    onclick="abrirMensaje(${registro.id}, 2)">

                    💬 Mensaje 2

                  </button>

                </div>

              </article>
            `;

          })
          .join("");
    }


    /* =====================================================
       FORMATEAR PRECIO
       ===================================================== */

    function formatearPrecio(precio) {

      return Number(precio).toLocaleString(
        "es-MX",
        {
          style: "currency",
          currency: "MXN"
        }
      );
    }


    /* =====================================================
       SEGURIDAD PARA TEXTO HTML
       ===================================================== */

    function escaparHTML(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================================
       MENSAJE 1
       ===================================================== */

    function crearMensaje1(registro) {

      const fecha =
        formatearFecha(
          registro.fecha_hora_entrega
        );


      return `¡Hola, ${registro.nombre_cliente}! 👋

Muchas gracias por elegirnos para cuidar tu ${registro.tipo_servicio}. 🧺✨

Tu servicio estará listo el:

📅 ${fecha}

💰 Total: ${formatearPrecio(registro.precio)}

Tu folio es: ${registro.folio}

Gracias por tu preferencia. ¡Será un placer atenderte! 😊`;
    }


    /* =====================================================
       MENSAJE 2
       ===================================================== */

    function crearMensaje2(registro) {

      return `¡Hola, ${registro.nombre_cliente}! 👋

Te informamos que tu ${registro.tipo_servicio} ya está lista. 🧺✨

📋 Folio: ${registro.folio}

💰 Total: ${formatearPrecio(registro.precio)}

Puedes pasar por ella cuando gustes.

¡Muchas gracias por elegirnos! 😊`;
    }


    /* =====================================================
       ABRIR VISTA PREVIA
       ===================================================== */

    function abrirMensaje(id, numeroMensaje) {

      const registro =
        registros.find(
          item => item.id === id
        );


      if (!registro) {
        return;
      }


      registroSeleccionado =
        registro;


      if (numeroMensaje === 1) {

        mensajeSeleccionado =
          crearMensaje1(registro);

        modalTitle.textContent =
          "💬 Vista previa — Mensaje 1";

      } else {

        mensajeSeleccionado =
          crearMensaje2(registro);

        modalTitle.textContent =
          "💬 Vista previa — Mensaje 2";
      }


      previewBox.textContent =
        mensajeSeleccionado;


      modalOverlay.classList.add(
        "active"
      );
    }


    /* =====================================================
       CERRAR MODAL
       ===================================================== */

    function cerrarModal() {

      modalOverlay.classList.remove(
        "active"
      );

      registroSeleccionado =
        null;

      mensajeSeleccionado =
        "";
    }


    closeModalButton.addEventListener(
      "click",
      cerrarModal
    );


    /* =====================================================
       CERRAR AL TOCAR FUERA
       ===================================================== */

    modalOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modalOverlay
        ) {

          cerrarModal();

        }

      }
    );


    /* =====================================================
       ENVIAR POR WHATSAPP
       ===================================================== */

    sendWhatsappButton.addEventListener(
      "click",
      function() {

        if (
          !registroSeleccionado ||
          !mensajeSeleccionado
        ) {
          return;
        }


        const telefono =
          registroSeleccionado.telefono;


        /*
         * WhatsApp necesita el código de país.
         * México = 52
         */

        const numeroWhatsApp =
          "52" + telefono;


        const mensajeCodificado =
          encodeURIComponent(
            mensajeSeleccionado
          );


        const url =
          `https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`;


        /*
         * Abrimos WhatsApp.
         *
         * En celular normalmente abrirá
         * directamente WhatsApp.
         */

        window.open(
          url,
          "_blank"
        );


        cerrarModal();

      }
    );


    /* =====================================================
       SUBMIT
       ===================================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        ocultarMensaje();


        if (!validarFormulario()) {
          return;
        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Registrando...";


        /*
         * Creamos el objeto que será enviado
         * exactamente al webhook.
         */

        const datos = {

          folio:
            folioInput.value.trim(),

          nombre_cliente:
            nombreInput.value.trim(),

          telefono:
            telefonoInput.value.trim(),

          tipo_servicio:
            servicioInput.value,

          precio:
            parseFloat(precioInput.value),

          fecha_hora_entrega:
            convertirAISO(
              fechaInput.value
            )

        };


        try {

          /* ===========================================
             POST A N8N
             =========================================== */

          const response =
            await fetch(
              WEBHOOK_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(datos)
              }
            );


          if (!response.ok) {

            throw new Error(
              `HTTP ${response.status}`
            );

          }


          /* ===========================================
             GUARDAR REGISTRO EN MEMORIA
             =========================================== */

          const registro = {

            ...datos,

            id:
              Date.now() +
              Math.random()

          };


          registros.push(
            registro
          );


          renderizarRegistros();


          /* ===========================================
             ÉXITO
             =========================================== */

          mostrarMensaje(
            "success",
            `✓ Pedido registrado correctamente. Folio: ${datos.folio}`
          );


          /*
           * Solamente limpiamos después
           * de recibir respuesta correcta.
           */

          form.reset();

          establecerFechaActual();

          folioInput.focus();


        } catch (error) {

          console.error(
            "Error enviando pedido:",
            error
          );


          /*
           * MUY IMPORTANTE:
           *
           * NO hacemos form.reset()
           *
           * Los datos permanecen en pantalla.
           */

          mostrarMensaje(
            "error",
            "No se pudo registrar el pedido. " +
            "Revisa tu conexión e inténtalo nuevamente. " +
            "Los datos capturados se conservaron."
          );


        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Registrar pedido";

        }

      }
    );


    /* =====================================================
       TELÉFONO — SOLO NÚMEROS
       ===================================================== */

    telefonoInput.addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 10);

      }
    );


    /* =====================================================
       PRECIO
       ===================================================== */

    precioInput.addEventListener(
      "input",
      function() {

        if (
          parseFloat(this.value) < 0
        ) {

          this.value = "";

        }

      }
    );


    /* =====================================================
       INICIALIZAR REGISTROS
       ===================================================== */

    renderizarRegistros();

  </script>

</body>
</html>
